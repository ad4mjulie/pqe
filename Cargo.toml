[package]
name = "pqe"
version = "0.2.0"
edition = "2021"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
ml-kem = { version = "0.2", features = ["deterministic"] }
ml-dsa = "0.1"
ed25519-dalek = "2"
aes-gcm = { version = "0.10", features = ["stream"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
x25519-dalek = { version = "2", features = ["static_secrets"] }
argon2 = "0.5"
tar = "0.4"
rpassword = "7"
eframe = { version = "0.29", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = { version = "0.15", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "pqe"
path = "src/main.rs"

[[bin]]
name = "pqe-gui"
path = "src/bin/pqe-gui.rs"
required-features = ["gui"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
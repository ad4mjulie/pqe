[package]
name = "pqe"
version = "0.1.0"
edition = "2021"

[dependencies]
ml-kem = { version = "0.2", features = ["deterministic"] }
aes-gcm = { version = "0.10", features = ["stream"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
x25519-dalek = { version = "2", features = ["static_secrets"] }
eframe = "0.29"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
